<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting — MediPredict AI</title>
    <script>
      // Automatically redirect GitHub Pages 404 paths to HashRouter
      (function() {
        var base = '/Diabetes-Prediction-/';
        var path = window.location.pathname;
        if (path.startsWith(base)) {
          var route = path.slice(base.length);
          if (route) {
            window.location.replace(base + '#/' + route + window.location.search + window.location.hash);
            return;
          }
        }
        window.location.replace(base);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to MediPredict AI...</p>
  </body>
</html>
